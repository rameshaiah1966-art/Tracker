<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyroscope Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Gyroscope and Accelerometer Data</h1>
    <button id="start-button">Start Sensors</button>
    <div id="sensor-data">
        <p>Accelerometer: <span id="accelerometer-data">Waiting for user permission...</span></p>
        <p>Gyroscope: <span id="gyroscope-data">Waiting for user permission...</span></p>
    </div>
    <div id="scene-container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
