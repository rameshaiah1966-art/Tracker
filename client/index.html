<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Signal Visualizer</h1>
    <div id="app-container">
        <canvas id="waveform-canvas"></canvas>
        <div id="controls">
            <button id="start-stop-button">Start</button>
            <div class="control-group">
                <label for="frequency-slider">Frequency</label>
                <input type="range" id="frequency-slider" min="20" max="20000" value="440" step="1">
                <span id="frequency-display">440 Hz</span>
            </div>
            <div class="control-group">
                <label>Band</label>
                <div id="band-buttons">
                    <button class="band-button active" data-band="hz">Hz</button>
                    <button class="band-button" data-band="khz">kHz</button>
                    <button class="band-button" data-band="mhz">MHz</button>
                </div>
            </div>
             <div class="control-group">
                <label for="gain-slider">Gain</label>
                <input type="range" id="gain-slider" min="0" max="1" value="0.5" step="0.01">
                <span id="gain-display">0.5</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
