<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Signal Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Environmental Signal Detector</h1>
    <div id="app-container">
        <div id="visualization-area">
            <div class="canvas-container">
                <h3>Waveform</h3>
                <canvas id="waveform-canvas"></canvas>
            </div>
            <div class="canvas-container">
                <h3>Spectrum</h3>
                <canvas id="spectrum-canvas"></canvas>
            </div>
        </div>

        <div class="control-group text-input-group">
            <label for="absolute-frequency-input">Set Absolute Frequency (Hz)</label>
            <input type="number" id="absolute-frequency-input" placeholder="e.g., 1500">
        </div>

        <div id="controls">
            <button id="start-stop-button">Start Listening</button>
            <div class="control-group frequency-control">
                <label>Coarse Tune</label>
                <input type="range" class="input-knob" id="coarse-knob" min="0" max="20" value="1" step="0.01" data-diameter="100">
                <div id="band-buttons">
                    <button class="band-button active" data-band="khz">kHz</button>
                    <button class="band-button" data-band="hz">Hz</button>
                    <button class="band-button" data-band="mhz">MHz</button>
                    <button class="band-button" data-band="ghz">GHz</button>
                </div>
            </div>
            <div class="control-group frequency-control">
                <label>Fine Tune (Hz)</label>
                <input type="range" class="input-knob" id="fine-knob" min="0" max="999" value="0" step="1" data-diameter="100">
            </div>
            <div class="control-group">
                <label for="gain-slider">Amplification</label>
                <input type="range" id="gain-slider" min="0" max="50" value="10" step="1">
                <span id="gain-display">10 dB</span>
            </div>
        </div>
        <div id="frequency-display-area">
            <h2>Target Frequency: <span id="frequency-display">1.00 kHz</span></h2>
        </div>
    </div>
    <p id="status-message">Click "Start Listening" to begin.</p>

    <script src="https://g200kg.github.io/input-knobs/input-knobs.js"></script>
    <script src="script.js"></script>
</body>
</html>
