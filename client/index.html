<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Signal Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Environmental Signal Detector</h1>
    <div id="app-container">
        <div id="visualization-area">
            <div class="canvas-container">
                <h3>Waveform (Time Domain)</h3>
                <canvas id="waveform-canvas"></canvas>
            </div>
            <div class="canvas-container">
                <h3>Spectrum (Frequency Domain)</h3>
                <canvas id="spectrum-canvas"></canvas>
            </div>
        </div>
        <div id="controls">
            <button id="start-stop-button">Start Listening</button>
            <div class="control-group">
                <label for="frequency-input">Target Frequency (Hz)</label>
                <input type="number" id="frequency-input" value="1000" min="20" max="20000">
            </div>
            <div class="control-group">
                <label for="gain-slider">Amplification</label>
                <input type="range" id="gain-slider" min="0" max="50" value="10" step="1">
                <span id="gain-display">10 dB</span>
            </div>
        </div>
    </div>
    <p id="status-message">Click "Start Listening" to begin processing audio from your microphone.</p>
    <script src="script.js"></script>
</body>
</html>
